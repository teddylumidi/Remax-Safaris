name: Validate Images

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-images:
    name: Check destination image references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate destination images
        run: npm run validate-images
