<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remax Safaris - Premier Kenya Safaris & Global Travel Consultancy</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Book extraordinary Kenya wildlife safaris, Maasai Mara migration tours, Diani beach holidays, global vacation packages, visa processing, and flight ticketing with Remax Safaris." />
    <meta name="keywords" content="Remax Safaris, Kenya safaris, Maasai Mara safari, Amboseli National Park, Diani Beach, luxury safari Kenya, flight ticketing Nairobi, visa assistance Kenya, holiday packages" />
    <meta name="author" content="Remax Safaris" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1B4332" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://remaxsafaris.com" id="canonical-link" />

    <!-- Performance Optimization: Resource Hints & Asset Preloading -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/logo.png" as="image" type="image/png" />
    <link rel="preload" href="/images/video_poster_elephants_waterhole.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="/images/video_poster_zanzibar_beach.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="/images/video_poster_singapore.jpg" as="image" type="image/jpeg" />
    <!-- Note: the hero video preload hint is injected dynamically by
         Hero.tsx, since which of the 3 hero videos is shown is chosen
         randomly at runtime. A static hint here would only ever match
         the actual video 1/3 of the time, wasting bandwidth preloading
         the wrong file while the real one loaded late. -->

    <!-- Favicons & Brand Assets -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://remaxsafaris.com" />
    <meta property="og:site_name" content="Remax Safaris" />
    <meta property="og:title" content="Remax Safaris - Premier Kenya Safaris & Global Travel Consultancy" />
    <meta property="og:description" content="Explore Kenya wildlife safaris, beach holidays, visa application processing, and flight ticketing with Remax Safaris." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://remaxsafaris.com" />
    <meta name="twitter:title" content="Remax Safaris - Premier Kenya Safaris & Global Travel Consultancy" />
    <meta name="twitter:description" content="Book extraordinary Kenya wildlife safaris, beach escapes, visa processing, and flights with Remax Safaris." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=1200&q=80" />

    <!-- Typography: Editorial Serif & Geometric Sans for Luxury Safari Consultancy -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#FDFBF7] text-[#1A2621] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
