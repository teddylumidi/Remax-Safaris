<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Remax Safaris - Premier Kenya Safaris & Global Travel Consultancy</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Book extraordinary Kenya wildlife safaris, Maasai Mara migration tours, Diani beach holidays, global vacation packages, visa processing, and flight ticketing with Remax Safaris." />
    <meta name="keywords" content="Remax Safaris, Kenya safaris, Maasai Mara safari, Amboseli National Park, Diani Beach, luxury safari Kenya, flight ticketing Nairobi, visa assistance Kenya, holiday packages" />
    <meta name="author" content="Remax Safaris" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1B4332" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://remaxsafaris.com" id="canonical-link" />

    <!-- Performance: DNS & Connection Hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical asset preloads -->
    <link rel="preload" href="/logo.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="/images/video_poster_elephants_waterhole.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="/images/video_poster_zanzibar_beach.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="/images/video_poster_singapore.jpg" as="image" type="image/jpeg" />

    <!-- Favicons & Brand Assets: use the real Remax Safaris logo from public/logo.png -->
    <link rel="icon" type="image/png" sizes="500x331" href="/logo.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" type="image/png" sizes="500x331" href="/logo.png?v=2" />

    <!-- Open Graph / Facebook SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://remaxsafaris.com" />
    <meta property="og:site_name" content="Remax Safaris" />
    <meta property="og:title" content="Remax Safaris - Premier Kenya Safaris & Global Travel Consultancy" />
    <meta property="og:description" content="Explore Kenya wildlife safaris, beach holidays, visa application processing, and flight ticketing with Remax Safaris." />
    <meta property="og:image" content="https://remaxsafaris.com/images/park_game_drive_binoculars.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://remaxsafaris.com" />
    <meta name="twitter:title" content="Remax Safaris - Premier Kenya Safaris & Global Travel Consultancy" />
    <meta name="twitter:description" content="Book extraordinary Kenya wildlife safaris, beach escapes, visa processing, and flights with Remax Safaris." />
    <meta name="twitter:image" content="https://remaxsafaris.com/images/park_game_drive_binoculars.jpg" />

    <!-- Typography: load non-render-blocking (swap + media trick) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body class="bg-[#FDFBF7] text-[#1A2621] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
